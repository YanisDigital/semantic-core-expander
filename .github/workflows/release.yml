name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed only to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install optional dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Build zip (runs the privacy scan first)
        run: python tools/build_zip.py --version "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "dist/semantic-core-expander-$GITHUB_REF_NAME.zip"
          "dist/semantic-core-expander-$GITHUB_REF_NAME.zip.sha256"
          --title "$GITHUB_REF_NAME"
          --notes "Install: download semantic-core-expander-$GITHUB_REF_NAME.zip, check it against the .sha256 file, then see README → Installation. Changes: see CHANGELOG.md."
          --verify-tag
